# Producción en un solo servidor: docker compose -f compose.prod.yaml up -d --build
# Lee los secretos de .env (copia de .env.example con los valores de producción).

services:
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      RATES_SERVICE_URL: http://rates-service:8091
      LOAN_SERVICE_URL: http://loan-service:8092
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    # ponytail: ajustado para una VM de 1 GB; subir el buffer pool si la VM crece.
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  rates-service:
    build: services/rates-service
    environment:
      RATES_SERVICE_TOKEN: ${RATES_SERVICE_TOKEN}
      FRANKFURTER_BASE_URL: https://api.frankfurter.dev/v2
    restart: unless-stopped

  loan-service:
    build: services/loan-service
    environment:
      LOAN_SERVICE_TOKEN: ${LOAN_SERVICE_TOKEN}
    restart: unless-stopped

volumes:
  storage:
  mysql:
  caddy_data:
  caddy_config:
